name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'site/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'site/**'
      - '.github/workflows/web-ci.yml'
  # ConsultantPlus makes document text available on weekdays from 20:00 to 24:00 Moscow time.
  # 17:30 UTC = 20:30 Moscow time; this run verifies the live source inside its published access window.
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Tests (child safety, chat, shop, tracks, math)
        working-directory: apps/web
        run: npm test
      - name: Build web app
        working-directory: apps/web
        run: npx vite build --base=./
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
