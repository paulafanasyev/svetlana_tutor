name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'site/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'site/**'
      - '.github/workflows/web-ci.yml'
  # ConsultantPlus makes document text available on weekdays from 20:00 to 24:00 Moscow time.
  # GitHub may delay scheduled jobs. Retry at four points within the window (MSK = UTC+3)
  # so one delayed run does not leave the live-source check unverified for the whole day.
  schedule:
    - cron: '5 17 * * 1-5'  # 20:05 MSK
    - cron: '5 18 * * 1-5'  # 21:05 MSK
    - cron: '5 19 * * 1-5'  # 22:05 MSK
    - cron: '5 20 * * 1-5'  # 23:05 MSK
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Tests (child safety, chat, shop, tracks, math)
        working-directory: apps/web
        run: npm test
      - name: Build web app
        working-directory: apps/web
        run: npx vite build --base=./
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
